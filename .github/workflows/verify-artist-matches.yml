name: Verify Artist Matches

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Verify artist candidates
        run: python -m src.verify_artist_matches

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: artist-match-verification
          path: data/artist_match_verification.csv
          if-no-files-found: error
          retention-days: 7
